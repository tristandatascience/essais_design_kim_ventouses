# Dev uniquement (hot-reload) : docker compose -f docker-compose.dev.yml up
services:
  dev:
    image: node:22-alpine
    container_name: essais-design-dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

volumes:
  node_modules:
