# Affichage des maquettes (nginx) — compatible docker-compose v1 et v2.
# Projet isolé du site de prod (soma-souffle, port 8080) :
# dossier, conteneur (essais-design), image et port (8081) distincts.
# Sur le VPS : charger l'image pré-construite (docker load) puis `up` —
# le `build:` n'est utilisé que si l'image est absente.
services:
  web:
    build: .
    image: essais-design-kim-ventouses:latest
    container_name: essais-design
    ports:
      - "${APP_PORT:-8081}:80"
    restart: unless-stopped
    mem_limit: 50m
